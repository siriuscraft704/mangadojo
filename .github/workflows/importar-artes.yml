name: Importar pacote de artes para revisão
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Link do ZIP anexado a uma Issue no GitHub (https://github.com/user-attachments/...)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: manga-art-candidates
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir hashes e preparar 12 candidatas em pasta de revisão
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: python tools/import_art_pack.py "$ZIP_URL"
      - name: Registrar imagens sem publicar em aulas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/review-pending/
          if ! git diff --cached --quiet; then
            git commit -m "art(review): stage 12 validated face and hair WebP candidates"
            git push
          else
            echo "Assets already staged; nothing to commit."
