name: Publicar MangaDojo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar e compilar catálogo
        run: python tools/build_catalog.py
      - name: Testes de regressão estática
        run: python tools/smoke_test.py
      - name: Verificar integridade e licenças de oito ilustrações MIT
        run: python tools/verify_mit_assets.py
      - name: Validar proporção do Smudge e exportação das aulas
        run: node tools/test_visual_geometry.cjs
      - name: Inventariar imagens e riscos de recorte
        run: python tools/media_audit.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
